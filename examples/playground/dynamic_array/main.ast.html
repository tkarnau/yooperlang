  .ast-row { padding: 1px 4px; border-radius: 3px; cursor: default; white-space: nowrap; }
  .ast-row.highlighted { background: rgba(255, 220, 0, 0.30); box-shadow: 0 0 0 1px rgba(255, 220, 0, 0.55); }
  .ast-row:hover { background: rgba(120, 180, 255, 0.18); }
  .ast-kind { color: #7ac6ff; font-weight: 600; }
  .ast-label { color: #888; margin-right: 4px; }
  .ast-fields { color: #c9a36c; font-size: 11px; }
  .ast-children { margin-left: 14px; border-left: 1px dotted #444; padding-left: 8px; }
  details > summary { list-style: none; outline: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "\25B6"; display: inline-block; width: 10px; font-size: 8px; color: #666; transition: transform .1s; margin-right: 2px; }
  details[open] > summary::before { transform: rotate(90deg); }
  details.leaf > summary::before { content: "\2022"; color: #444; transform: none; }
  @media (prefers-color-scheme: light) {
    body { background: #fafafa; color: #222; }
    header { background: #eaeaea; color: #222; }
    .pane { background: #fff; }
    main { background: #ccc; }
    .ast-kind { color: #06c; }
    .ast-fields { color: #a05a00; }
    .ast-children { border-left-color: #ddd; }
  }

<script type="application/json" id="data">{"filename":"./examples/playground/dynamic_array/main.yoop","source":"// Safe, generic dynamic array.\n//\n//   - `DynArray<T> implements Disposable propagates<usedisposable>`:\n//     the type itself is the disposable thing, and its `propagates<usedisposable>`\n//     clause tells every binding of DynArray<T> to inherit the dispose obligation.\n//   - `new_dynarray<T>(...): DynArray<T> propagates<usedisposable>`:\n//     factory that pushes the obligation through its return type to the caller.\n//   - Calling `let arr: DynArray<int32> = new_dynarray(4)` is enough — no kind\n//     keyword required. The compiler auto-inserts `Disposable.dispose(ref arr)`\n//     before scope end.\n//\n// Try removing `propagates<usedisposable>` from the type and the compiler will\n// no longer auto-inject the cleanup. Try leaking `arr` out of the scope and\n// the kind's `mustNotShare acrossScopes` would (with that clause re-added) be\n// rejected too.\n\n/*\n    This demonstrates a dynamic array implementation for yooperlang\n\n\n*/\n\nextern \"C\" from \"stdio.h\" {\n    function printf(fmt: string, ...): int32;\n}\n\ntrait Disposable {\n    function dispose(ref self): void;\n}\n\n\nkind usedisposable {\n    appliesTo binding;\n    requires Disposable;\n    ownsBlock;\n    mustCall dispose beforeScopeEnd;\n}\n\n// The generic struct *is* the Disposable. `propagates<usedisposable>` says\n// \"every binding of me inherits the dispose obligation.\"\ntype DynArray<T> implements Disposable propagates<usedisposable> {\n    data: T[],\n    len: usize,\n    cap: usize,\n\n    function dispose(ref self): void {\n        printf(`(dispose: freeing DynArray, len=${self.len} cap=${self.cap})\\n`);\n        heap_free(self.data);\n    }\n}\n\n// Factory. `propagates<usedisposable>` documents the contract; the obligation\n// is also surfaced via the type itself, so either is sufficient.\nfunction new_dynarray<T>(initial_cap: usize): DynArray<T> {\n    con <script>
(() => {
  const data = JSON.parse(document.getElementById('data').textContent);
  document.getElementById('filename').textContent = data.filename;
  const sourcePre = document.getElementById('source');
  sourcePre.textContent = data.source;
  const astRoot = document.getElementById('ast');
  const sourcePane = document.getElementById('source-pane');
  const astPane = document.getElementById('ast-pane');

  const idToRow = new Map();
  const idToLoc = new Map();
  const flatNodes = [];

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function fieldsToHtml(fields) {
    const keys = Object.keys(fields);
    if (!keys.length) return '';
    const parts = keys.map(k => {
      const v = fields[k];
      const s = typeof v === 'string' ? JSON.stringify(v) : JSON.stringify(v);
      return esc(k) + ': ' + esc(s);
    });
    return ' <span class="ast-fields">{' + parts.join(', ') + '}</span>';
  }

  function render(node) {
    if (node.kind === 'GROUP') {
      const det = document.createElement('details');
      det.open = true;
      const sum = document.createElement('summary');
      sum.className = 'ast-row';
      sum.innerHTML = '<span class="ast-label">' + esc(node.label) + ':</span> <span class="ast-fields">[' + node.children.length + ']</span>';
      det.appendChild(sum);
      const ch = document.createElement('div');
      ch.className = 'ast-children';
      for (const c of node.children) ch.appendChild(render(c));
      det.appendChild(ch);
      return det;
    }
    const det = document.createElement('details');
    det.open = true;
    const sum = document.createElement('summary');
    sum.className = 'ast-row';
    sum.dataset.id = node.id;
    let html = '';
    if (node.label) html += '<span class="ast-label">' + esc(node.label) + ':</span> ';
    html += '<span class="ast-kind">' + esc(node.kind) + '</span>';
    html += fieldsToHtml(node.fields || {});
    sum.innerHTML = html;
    det.appendChild(sum);
    idToRow.set(node.id, sum);
    if (node.loc) {
      idToLoc.set(node.id, node.loc);
      flatNodes.push({ id: node.id, pos: node.loc.pos, length: node.loc.length || 0 });
    }
    if (node.children && node.children.length) {
      const ch = document.createElement('div');
      ch.className = 'ast-children';
      for (const c of node.children) ch.appendChild(render(c));
      det.appendChild(ch);
    } else {
      det.classList.add('leaf');
    }
    return det;
  }

  astRoot.appendChild(render(data.ast));
  // smallest containing node wins -> sort by length asc
  flatNodes.sort((a, b) => a.length - b.length);

  // ---- source highlighting via DOM Range overlay ----
  let srcOverlays = [];
  function clearSrc() { for (const el of srcOverlays) el.remove(); srcOverlays = []; }
  function highlightSource(pos, length) {
    clearSrc();
    if (!length) return;
    const text = sourcePre.firstChild;
    if (!text) return;
    const end = Math.min(pos + length, text.length);
    if (pos >= end) return;
    const range = document.createRange();
    try { range.setStart(text, pos); range.setEnd(text, end); }
    catch { return; }
    const paneRect = sourcePane.getBoundingClientRect();
    for (const rect of range.getClientRects()) {
      const div = document.createElement('div');
      div.className = 'src-highlight';
      div.style.left = (rect.left - paneRect.left + sourcePane.scrollLeft) + 'px';
      div.style.top = (rect.top - paneRect.top + sourcePane.scrollTop) + 'px';
      div.style.width = rect.width + 'px';
      div.style.height = rect.height + 'px';
      sourcePane.appendChild(div);
      srcOverlays.push(div);
    }
  }

  // ---- AST highlighting ----
  let highlightedRow = null;
  function highlightAst(id, { scroll }) {
    if (highlightedRow) highlightedRow.classList.remove('highlighted');
    highlightedRow = null;
    if (id == null) return;
    const row = idToRow.get(id);
    if (!row) return;
    row.classList.add('highlighted');
    highlightedRow = row;
    if (scroll) {
      let p = row.parentElement;
      while (p) { if (p.tagName === 'DETAILS') p.open = true; p = p.parentElement; }
      const r = row.getBoundingClientRect();
      const pr = astPane.getBoundingClientRect();
      if (r.top < pr.top + 8 || r.bottom > pr.bottom - 8) row.scrollIntoView({ block: 'center' });
    }
  }

  // AST -> source
  astRoot.addEventListener('mouseover', (e) => {
    const row = e.target.closest('.ast-row');
    if (!row || !row.dataset.id) return;
    const loc = idToLoc.get(+row.dataset.id);
    if (loc) highlightSource(loc.pos, loc.length || 0);
  });
  astPane.addEventListener('mouseleave', clearSrc);

  // source -> AST
  function caretOffset(x, y) {
    if (document.caretPositionFromPoint) {
      const r = document.caretPositionFromPoint(x, y);
      if (r && r.offsetNode === sourcePre.firstChild) return r.offset;
    } else if (document.caretRangeFromPoint) {
      const r = document.caretRangeFromPoint(x, y);
      if (r && r.startContainer === sourcePre.firstChild) return r.startOffset;
    }
    return -1;
  }
  let lastId = -1;
  sourcePane.addEventListener('mousemove', (e) => {
    const off = caretOffset(e.clientX, e.clientY);
    if (off < 0) return;
    let foundId = null, foundLoc = null;
    for (const n of flatNodes) {
      if (n.pos <= off && off < n.pos + n.length) {
        foundId = n.id; foundLoc = n; break;
      }
    }
    if (foundId === lastId) return;
    lastId = foundId;
    highlightAst(foundId, { scroll: true });
    if (foundLoc) highlightSource(foundLoc.pos, foundLoc.length);
    else clearSrc();
  });
  sourcePane.addEventListener('mouseleave', () => {
    lastId = -1;
    highlightAst(null, { scroll: false });
    clearSrc();
  });

  // recompute overlays after resize / scroll
  let pendingId = null;
  function refreshOverlay() {
    if (highlightedRow && highlightedRow.dataset.id) {
      const loc = idToLoc.get(+highlightedRow.dataset.id);
      if (loc) highlightSource(loc.pos, loc.length || 0);
    }
  }
  window.addEventListener('resize', refreshOverlay);
  sourcePane.addEventListener('scroll', refreshOverlay);
})();
</script>
</body>
