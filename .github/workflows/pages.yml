# Publishes the static site in web/ to GitHub Pages.
#
# One-time setup in the repo on GitHub: Settings -> Pages -> Build and
# deployment -> Source: "GitHub Actions". Pages on a free plan needs the
# repository to be PUBLIC. After that, every push to main that touches web/
# (or a manual run) redeploys the site, at https://tkarnau.github.io/yooperlang/.
#
# This publishes the files as they are COMMITTED. web/data/*.data.js is
# generated by `npm run gen:web`, which needs clang and a seed; running it
# here would make a page deploy depend on a compiler build, so it stays a
# thing a change runs locally and commits. A push that changes std/ or a tour
# program without regenerating publishes stale data - that is the tradeoff.
#
# Nothing here runs Jekyll (upload-pages-artifact uploads the directory as
# static files), so no .nojekyll file is needed and leading-underscore names
# would be served fine.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. An in-progress run is NOT cancelled: it is a
# production deploy and a half-finished one is worse than a slightly stale
# one. Runs queued behind it collapse to the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is served from a SUBPATH (/yooperlang/), so a root-absolute
      # href or src to a local file would 404 in production while working
      # fine from a local server rooted at web/. Catch that here rather than
      # after the deploy. Absolute URLs to other sites are fine.
      - name: Check the site is subpath-safe
        run: |
          test -f web/index.html
          if grep -nE '(href|src)="/[^/]' web/*.html web/assets/*.js; then
            echo "::error::root-absolute local path found; the site is served from /yooperlang/ so paths must be relative"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
